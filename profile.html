<!DOCTYPE html>
<html>

<head>

<title>My Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

{% extends "layout.html" %}

{% block title %}My Profile - JobShield{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 p-4 text-center">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" width="120" class="mx-auto mb-3">
                <h2>{{ user["name"] }}</h2>
                <p class="text-white-50">{{ user["email"] }}</p>
                <hr>
                <div class="row mt-4">
                    <div class="col-6">
                        <h5 class="text-light">Name</h5>
                        <p>{{ user["name"] }}</p>
                    </div>
                    <div class="col-6">
                        <h5 class="text-light">Email</h5>
                        <p>{{ user["email"] }}</p>
                    </div>
                </div>
                <a href="/history" class="btn btn-gradient mt-3">View Reports</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
</html>
