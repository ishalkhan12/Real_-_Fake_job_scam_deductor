{% extends "layout.html" %}

{% block title %}Set New Password - JobShield{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card p-4 p-md-5 mx-auto animate-fade-up" style="max-width: 450px;">
        <div class="text-center mb-4">
            <i class="fa-solid fa-lock text-success fs-1 mb-2"></i>
            <h3 class="fw-bold">Create New Password</h3>
            <p class="text-white-50 small">Enter your new password twice.</p>
        </div>
        <form action="/reset-password" method="POST">
            <input type="hidden" name="token" value="{{ token }}">
            <div class="mb-3">
                <label class="form-label small fw-semibold">New Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-gradient w-100 btn-lg fw-bold">
                <i class="fa-regular fa-circle-check me-2"></i>Update Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
